name: CI - Image Classification Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reproduce DVC pipeline (prepare -> train -> evaluate)
        run: dvc repro --force

      - name: Show metrics
        run: dvc metrics show

      - name: Run tests
        run: python -m pytest test.py -v --junitxml=test-results.xml

      - name: Upload test results and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            metrics.json
